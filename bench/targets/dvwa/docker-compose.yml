# Authorized local lab only. Read ../README.md before startup.
services:
  dvwa:
    image: ${DXA_DVWA_IMAGE:?Set a reviewed immutable DVWA image reference}
    ports:
      - "127.0.0.1:8081:80"
    pull_policy: never
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10
