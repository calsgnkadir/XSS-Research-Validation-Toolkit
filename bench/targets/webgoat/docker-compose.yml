# Authorized local lab only. Read ../README.md before startup.
services:
  webgoat:
    image: ${DXA_WEBGOAT_IMAGE:?Set a reviewed immutable WebGoat image reference}
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9090:9090"    # WebWolf, the companion attack surface
    environment:
      - WEBGOAT_HOST=0.0.0.0
      - WEBWOLF_HOST=0.0.0.0
    pull_policy: never
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/WebGoat/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
