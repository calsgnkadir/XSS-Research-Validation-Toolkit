# Authorized local lab only. Read ../README.md before startup.
services:
  bludit:
    image: ${DXA_BLUDIT_IMAGE:?Set a reviewed immutable Bludit image reference}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - bludit-data:/var/www/html/bl-content
    pull_policy: never
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bludit-data:
