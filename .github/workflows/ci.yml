name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: dom-xss-analyzer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        working-directory: tools/dom-xss-analyzer
        run: pytest -q

      - name: Required R1 and R2 negative controls
        working-directory: tools/dom-xss-analyzer
        run: pytest test_http_evidence.py test_blind_correlation.py test_auth_guards.py test_r2_contract.py -q

      - name: Self-scan the example corpus
        working-directory: tools/dom-xss-analyzer
        run: |
          # the analyzer must still flag the intentionally-vulnerable examples
          python dxa.py examples/ --min-confidence high && exit 1 || echo "findings reported as expected"

      - name: Benchmark harness tests
        run: pytest bench/test_bench.py -q

      - name: Benchmark smoke run (dxadyn on mock corpus, strict)
        env:
          BENCH_STRICT: "1"
        run: python bench/run.py --targets mock-reflected-easy,mock-reflected-escaped,mock-stored-guestbook --out bench/results-ci.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench/results-ci.md
            bench/results-ci.json

  r3-proof:
    name: Required local authenticated browser proof
    runs-on: ubuntu-latest
    env:
      DXA_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Run R3 acceptance tests
        working-directory: tools/dom-xss-analyzer
        run: pytest test_browser_proof.py -q
      - name: Run one-command proof demo
        run: python tools/dom-xss-analyzer/dxaprove.py --demo --output r3-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-browser-proof
          path: r3-proof/

  browser-tests:
    name: dxadom browser harness (Playwright opt-in)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest + playwright
        run: |
          python -m pip install --upgrade pip pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run dxadom tests with a real browser
        working-directory: tools/dom-xss-analyzer
        run: pytest test_dxadom.py -q
