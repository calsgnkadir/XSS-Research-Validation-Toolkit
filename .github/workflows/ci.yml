name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: dom-xss-analyzer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip '.[test]'

      - name: Build and verify installed wheel outside source tree
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/r6-wheel"
          python -m venv "$RUNNER_TEMP/r6-venv"
          "$RUNNER_TEMP/r6-venv/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/r6-wheel/*.whl
          python bench/check_installed_cli.py --bin-dir "$RUNNER_TEMP/r6-venv/bin" --wheel "$RUNNER_TEMP"/r6-wheel/*.whl --output r6-installed.json
      - uses: actions/upload-artifact@v4
        with:
          name: r6-installed-package
          if-no-files-found: error
          path: |
            r6-installed.json
            ${{ runner.temp }}/r6-wheel/*.whl

      - name: Run test suite
        working-directory: tools/dom-xss-analyzer
        run: pytest -q

      - name: Required R1 and R2 negative controls
        working-directory: tools/dom-xss-analyzer
        run: pytest test_http_evidence.py test_blind_correlation.py test_auth_guards.py test_r2_contract.py -q

      - name: Self-scan the example corpus
        run: python bench/ci_self_scan.py

      - name: Benchmark harness tests
        run: pytest bench/test_bench.py bench/test_proof_adapter.py bench/test_ci_self_scan.py bench/test_ci_acceptance.py bench/test_bludit_adapter.py bench/test_bludit_ingress.py bench/test_r4_compare_local.py bench/test_r4_comparison_acceptance.py bench/test_r4_scanner_sessions.py bench/test_check_installed_cli.py -q

      - name: Benchmark smoke run (dxadyn on mock corpus, strict)
        env:
          BENCH_STRICT: "1"
        run: python bench/run.py --targets mock-reflected-easy,mock-reflected-escaped,mock-stored-guestbook --out bench/results-ci.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench/results-ci.md
            bench/results-ci.json

  r3-proof:
    name: Required local authenticated browser proof
    runs-on: ubuntu-latest
    env:
      DXA_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Run R3 acceptance tests
        run: pytest tools/dom-xss-analyzer/test_browser_proof.py tools/dom-xss-analyzer/test_proof_cleanup.py bench/test_proof_adapter.py bench/test_proof_corpus.py bench/test_proof_identity_matrix.py bench/test_auth_failure_corpus.py bench/test_blind_admin_contract.py bench/test_auth_failure_runner.py bench/test_r4_two_account_fixture.py bench/test_r4_comparison_fixture.py bench/test_r4_cid_oracle.py bench/test_e05_context_coverage.py -q --junitxml=r3-r4-pytest.xml
      - name: Run R4 execution corpus (strict, no history)
        env:
          BENCH_STRICT: "1"
        run: python bench/run.py --proof-suite --no-history --out r4-proof.md
      - name: Run R4 auth failure controls (required, separate from XSS accuracy)
        run: python bench/run.py --targets mock-reflected-easy --auth-failure-controls --no-history --out auth-controls.md
      - name: Run one-command proof demo
        run: python tools/dom-xss-analyzer/dxaprove.py --demo --output r3-proof
      - name: Require complete R3/R4 artifact evidence with zero skipped tests
        run: python bench/check_ci_acceptance.py --junit r3-r4-pytest.xml --corpus r4-proof.json --corpus-markdown r4-proof.md --demo r3-proof/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-browser-proof
          if-no-files-found: error
          path: |
            r3-proof/
            r3-r4-pytest.xml
            r4-proof.json
            r4-proof.md
            auth-controls.json
            auth-controls.md

  browser-tests:
    name: dxadom browser harness (Playwright opt-in)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest + playwright
        run: |
          python -m pip install --upgrade pip pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run dxadom tests with a real browser
        working-directory: tools/dom-xss-analyzer
        run: pytest test_dxadom.py -q
