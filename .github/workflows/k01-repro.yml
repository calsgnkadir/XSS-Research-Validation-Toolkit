name: K01 Linux clean reproduction

on:
  push:
  pull_request:

jobs:
  k01-repro:
    name: K01 clean Linux browser proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned proof dependency and Chromium
        run: |
          python -m pip install -r cases/k01-stored-comment/requirements-proof.txt pytest
          python -m playwright install --with-deps chromium
      - name: Check K01 gate counterexamples
        run: python -m pytest cases/k01-stored-comment/test_fixture.py cases/k01-stored-comment/test_repro_gate.py -q --junitxml=k01-gate-pytest.xml
      - name: Run K01 proof and independent artifact gate
        run: python cases/k01-stored-comment/check_repro.py --output k01-linux-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k01-linux-proof
          if-no-files-found: error
          path: |
            k01-linux-proof/
            k01-gate-pytest.xml
