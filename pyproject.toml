[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dxa-research-toolkit"
version = "0.2.2"
description = "Research CLI for XSS candidate analysis and local proof labs"
readme = "docs/PYPI-README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.urls]
Repository = "https://github.com/calsgnkadir/XSS-Research-Validation-Toolkit"
Documentation = "https://github.com/calsgnkadir/XSS-Research-Validation-Toolkit/blob/main/README.md"
Issues = "https://github.com/calsgnkadir/XSS-Research-Validation-Toolkit/issues"

[project.optional-dependencies]
browser = ["playwright==1.63.0"]
test = ["pytest", "jsonschema>=4.18,<5"]

[project.scripts]
dxa = "dxa:main"
dxadyn = "dxadyn:main"
dxaprove = "dxaprove:main"
dxa-sarif = "dxa_sarif_cli:main"

[tool.setuptools]
py-modules = [
  "dxa", "dxadyn", "dxaprove", "dxadom", "dxa_evidence",
  "dxa_callback", "dxa_attempts", "dxa_proof_lab", "dxa2dyn", "dxa_sarif",
  "dxa_sarif_cli"
]

[tool.setuptools.package-dir]
"" = "tools/dom-xss-analyzer"
